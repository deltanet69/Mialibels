<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Development - MI Attaqwa 15</title>
    <style>
        :root {
            --primary: #10b981; /* Emerald 500 */
            --bg-color: #0f172a; /* Slate 900 */
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #94a3b8; /* Slate 400 */
            --card-bg: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        p.description {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            margin-bottom: 3rem;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem;
            border-radius: 15px;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .countdown-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1rem;
            }
            .countdown {
                gap: 1rem;
            }
            .countdown-item {
                min-width: 80px;
                padding: 1rem;
            }
            .countdown-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">MI</div>
        
        <h1>Under Development</h1>
        
        <p class="description">
            Website resmi MI Attaqwa 15 sedang dalam tahap pengembangan dan pembaruan. 
            Kami sedang menyiapkan pengalaman digital yang lebih baik untuk siswa, guru, dan orang tua.
        </p>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="days">00</div>
                <div class="countdown-label">Hari</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="hours">00</div>
                <div class="countdown-label">Jam</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="minutes">00</div>
                <div class="countdown-label">Menit</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="seconds">00</div>
                <div class="countdown-label">Detik</div>
            </div>
        </div>

        <div class="footer">
            &copy; <span id="year"></span> MI Attaqwa 15. All rights reserved.
        </div>
    </div>

    <script>
        // Set tahun di footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Set target date (misalnya 30 hari dari sekarang, atau set tanggal spesifik)
        // Format: Date("Maret 1, 2027 00:00:00")
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30); // Set 30 hari dari sekarang
        const targetTime = targetDate.getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            // Perhitungan waktu
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Tampilkan hasil, dengan padding nol di depan jika < 10
            document.getElementById("days").textContent = days.toString().padStart(2, '0');
            document.getElementById("hours").textContent = hours.toString().padStart(2, '0');
            document.getElementById("minutes").textContent = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").textContent = seconds.toString().padStart(2, '0');

            // Jika hitung mundur selesai
            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("countdown").innerHTML = "<div style='font-size: 1.5rem; color: #10b981; font-weight: bold;'>Website Segera Hadir!</div>";
            }
        }

        // Update setiap 1 detik
        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
